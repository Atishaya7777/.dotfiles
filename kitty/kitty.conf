# ~~~~~~~ KITTY CONFIG ~~~~~~~~ #
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ #
editor /opt/homebrew/bin/nvim
shell  /bin/zsh --login --interactive
# ~~~~~ url settings ~~~~~ #
url_style                     curly
detect_urls                   yes
# ~~~~~ Font settings ~~~~#
font_family      Lilex Nerd Font Mono Regular
bold_font        Lilex Nerd Font Mono Bold
italic_font      Lilex Nerd Font Mono Italic
bold_italic_font Lilex Nerd Font Mono Bold Italic
font_size 12.5
cursor_blink_interval 0
# ~~~~~ Window settings ~~~~~ #
# Will be used to remove the window title bar and borders
# hide_window_decorations yes 
window_padding_width 5 5 0 0
# ~~~~~ Theme ~~~~~ #
# ~~~~~ Minimizing latency at the expense of more energy usage ~~~~~~
# Docs: https://sw.kovidgoyal.net/kitty/performance/
input_delay 0
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no
enable_audio_bell no
include /Users/atishayamaharjan/.dotfiles/kitty/current-theme.conf
# BEGIN_KITTY_THEME
# Kanagawa
include /Users/atishayamaharjan/.dotfiles/kitty/current-theme.conf
# END_KITTY_THEME
